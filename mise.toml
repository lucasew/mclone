[tools]
"github:lucasew/workspaced" = "0.1.2"
go = "1.24.0"
"go:golang.org/x/tools/gopls" = "0.21.0"
goreleaser = "2.14.1"
svu = "3.3.0"

[tasks.install]
description = "Install dependencies"
depends = ["install:*"]

[tasks."install:deps"]
description = "Smartly detect the package manager and install dependencies"
run = """
#!/usr/bin/env bash
if [ -f "go.mod" ]; then
  go mod download
elif [ -f "package.json" ]; then
  npm install
fi
"""

[tasks.codegen]
description = "Update generated code"
depends = ["codegen:*"]

[tasks."codegen:main"]
run = "go generate ./..."

[tasks.test]
description = "Run tests"
depends = ["test:*"]

[tasks."test:main"]
run = "go test -v ./..."

[tasks.build]
description = "Build the binary"
depends = ["build:*"]

[tasks."build:main"]
run = "go build -o mclone ./cmd/mclone"

[tasks.lint]
description = "Run all linters"
run = "workspaced codebase lint"

[tasks.fmt]
description = "Format all code"
run = "workspaced codebase format"

[tasks.ci]
description = "Run CI pipeline"
depends = ["lint", "test"]

[tasks.release]
description = "Run a release"
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = '''
git tag $(svu ${usage_version})
goreleaser release --clean
'''
