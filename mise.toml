[tools]
go = "1.24.0"
golangci-lint = "1.64.6"
node = "22.13.1"
actionlint = "1.7.7"
"npm:prettier" = "3.5.1"

[tasks.install]
description = "Install dependencies"
run = "go mod download"

[tasks.codegen]
description = "Update generated code"
run = "go generate ./..."

[tasks.test]
description = "Run tests"
run = "go test -v ./..."

[tasks.build]
description = "Build the binary"
run = "go build -o mclone ./cmd/mclone"

[tasks."lint:go"]
description = "Lint Go code"
run = "golangci-lint run ./..."

[tasks."lint:actionlint"]
description = "Lint GitHub Actions"
run = "actionlint"

[tasks.lint]
description = "Run all linters"
depends = ["lint:*"]

[tasks."fmt:go"]
description = "Format Go code"
run = "go fmt ./..."

[tasks."fmt:prettier"]
description = "Format non-Go files"
run = "prettier --write ."

[tasks.fmt]
description = "Format all code"
depends = ["fmt:*"]

[tasks.ci]
description = "Run CI pipeline"
depends = ["lint", "test", "build"]
